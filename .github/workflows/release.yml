name: Build & Release Executables

on:
  push:
    tags:
      - "v*"          # triggers on: git tag v0.1.2 && git push --tags
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: agentsentry.exe
            asset_name: agentsentry-windows.exe
          - os: macos-latest
            artifact: agentsentry
            asset_name: agentsentry-macos
          - os: ubuntu-latest
            artifact: agentsentry
            asset_name: agentsentry-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build executable
        run: python build_exe.py

      - name: Rename artifact
        shell: bash
        run: mv dist/${{ matrix.artifact }} dist/${{ matrix.asset_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
