<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1419;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1724;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>

  <!-- Accent glow (top right) -->
  <circle cx="1100" cy="-150" r="500" fill="url(#glowGradient)" opacity="0.6"/>

  <!-- Badge -->
  <g transform="translate(80, 50)">
    <circle cx="4" cy="8" r="4" fill="#3b82f6"/>
    <text x="16" y="14" font-family="'DM Sans', sans-serif" font-size="14" font-weight="600" fill="#3b82f6" letter-spacing="0.5">
      Open Source · v0.2.0
    </text>
  </g>

  <!-- Main heading -->
  <text x="80" y="120" font-family="'Playfair Display', serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Find Every Machine
  </text>
  <text x="80" y="185" font-family="'Playfair Display', serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Identity Before They Do
  </text>

  <!-- Subheading -->
  <text x="80" y="235" font-family="'DM Sans', sans-serif" font-size="18" fill="#cbd5e1" letter-spacing="0" line-height="26">
    Discover ungoverned AI agents and service accounts.
  </text>
  <text x="80" y="265" font-family="'DM Sans', sans-serif" font-size="18" fill="#cbd5e1" letter-spacing="0">
    Score blast radius. Fix before attackers do.
  </text>

  <!-- Features grid -->
  <g font-family="'DM Sans', sans-serif" font-size="14" fill="#e2e8f0">
    <!-- Feature 1 -->
    <text x="80" y="330" fill="#3b82f6" font-weight="bold">✓</text>
    <text x="100" y="330">Multi-cloud NHI discovery</text>

    <!-- Feature 2 -->
    <text x="80" y="365" fill="#3b82f6" font-weight="bold">✓</text>
    <text x="100" y="365">P×R×E×A blast scoring</text>

    <!-- Feature 3 -->
    <text x="520" y="330" fill="#3b82f6" font-weight="bold">✓</text>
    <text x="540" y="330">Least-privilege analysis</text>

    <!-- Feature 4 -->
    <text x="520" y="365" fill="#3b82f6" font-weight="bold">✓</text>
    <text x="540" y="365">Attack graph visualization</text>
  </g>

  <!-- Right accent panel -->
  <rect x="900" y="0" width="300" height="630" fill="#3b82f6" opacity="0.05"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>

  <!-- Right side branding -->
  <text x="1100" y="490" font-family="'Playfair Display', serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="end">
    Agent<tspan fill="#3b82f6">Sentry</tspan>
  </text>
  <text x="1100" y="515" font-family="'DM Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="end" letter-spacing="0.5" font-weight="600">
    NHI RISK AUDITOR
  </text>

  <!-- Bottom left URL -->
  <text x="80" y="590" font-family="'DM Sans', sans-serif" font-size="13" fill="#64748b">
    agentsentry.org
  </text>
</svg>
