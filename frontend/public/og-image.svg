<svg width="100%" height="100%" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1419;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1724;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Full background coverage -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>

  <!-- Accent glow (extended) -->
  <circle cx="1300" cy="-150" r="650" fill="url(#glowGradient)" opacity="0.8"/>

  <!-- Left content area (0-800px) -->
  <g>
    <!-- Badge -->
    <g transform="translate(60, 45)">
      <circle cx="4" cy="8" r="4" fill="#3b82f6"/>
      <text x="16" y="14" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#3b82f6" letter-spacing="0.5">
        Open Source · v0.2.0
      </text>
    </g>

    <!-- Main heading -->
    <text x="60" y="120" font-family="'Playfair Display', Georgia, serif" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1.5" line-height="1.1">
      Find Every
    </text>
    <text x="60" y="190" font-family="'Playfair Display', Georgia, serif" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Machine Identity
    </text>
    <text x="60" y="260" font-family="'Playfair Display', Georgia, serif" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Before They Do
    </text>

    <!-- Subheading -->
    <text x="60" y="315" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" fill="#cbd5e1" letter-spacing="0">
      Discover ungoverned AI agents and service accounts.
    </text>
    <text x="60" y="345" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" fill="#cbd5e1" letter-spacing="0">
      Score blast radius. Fix before attackers do.
    </text>

    <!-- Features grid -->
    <g font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#e2e8f0">
      <text x="60" y="405" fill="#3b82f6" font-weight="bold" font-size="16">✓</text>
      <text x="85" y="405">Multi-cloud NHI discovery</text>

      <text x="60" y="440" fill="#3b82f6" font-weight="bold" font-size="16">✓</text>
      <text x="85" y="440">P×R×E×A blast scoring</text>

      <text x="480" y="405" fill="#3b82f6" font-weight="bold" font-size="16">✓</text>
      <text x="505" y="405">Least-privilege analysis</text>

      <text x="480" y="440" fill="#3b82f6" font-weight="bold" font-size="16">✓</text>
      <text x="505" y="440">Attack graph visualization</text>
    </g>

    <!-- Bottom left URL -->
    <text x="60" y="590" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b" font-weight="500">
      agentsentry.org
    </text>
  </g>

  <!-- Right accent panel (800-1200px) — FULL HEIGHT -->
  <rect x="800" y="0" width="400" height="630" fill="#3b82f6" opacity="0.07"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#3b82f6" stroke-width="2" opacity="0.25"/>

  <!-- Right side branding -->
  <g>
    <text x="1000" y="480" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">
      Agent<tspan fill="#3b82f6">Sentry</tspan>
    </text>
    <text x="1000" y="512" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="1.2" font-weight="700">
      NHI RISK AUDITOR
    </text>

    <!-- Divider -->
    <line x1="850" y1="530" x2="1150" y2="530" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>

    <!-- Version -->
    <text x="1000" y="570" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="700" letter-spacing="0.5">
      v0.2.0
    </text>
  </g>

  <!-- Decorative circles on right -->
  <circle cx="870" cy="140" r="70" fill="#3b82f6" opacity="0.06"/>
  <circle cx="1050" cy="200" r="50" fill="#3b82f6" opacity="0.08"/>
</svg>
