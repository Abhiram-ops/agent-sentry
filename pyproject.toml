[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsentry"
version = "0.1.0"
description = "Open-source auditor for Non-Human Identities and AI Agent attack surfaces in cloud environments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abhiram Lanka", email = "lankaabhiram16@gmail.com" }]
keywords = ["security", "cloud", "iam", "ai-agents", "non-human-identity", "attack-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "networkx>=3.2",
    "pyvis>=0.3",
    "click>=8.1",
    "rich>=13.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Cloud providers — install only what you need
aws    = ["boto3>=1.34"]
azure  = [
    "azure-identity>=1.16",
    "azure-mgmt-authorization>=4.0",
    "azure-mgmt-resource>=23.0",
]
gcp    = [
    "google-auth>=2.28",
    "google-api-python-client>=2.120",
]
github = ["requests>=2.31"]          # requests is also a core dep — already available
k8s    = ["kubernetes>=29.0"]

# Convenience bundles
all-clouds = [
    "agentsentry[aws]",
    "agentsentry[azure]",
    "agentsentry[gcp]",
    "agentsentry[github]",
    "agentsentry[k8s]",
]

dev       = ["pytest>=8.0", "pytest-cov", "black", "ruff", "mypy"]
dashboard = ["streamlit>=1.32"]

[project.scripts]
agentsentry = "agentsentry.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentsentry*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
