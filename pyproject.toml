[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nhi-audit"
version = "0.1.3"
description = "Open-source auditor for Non-Human Identities and AI Agent attack surfaces in cloud environments"
authors = [{ name = "Abhiram Lanka", email = "lankaabhiram16@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["security", "cloud", "iam", "ai-agents", "non-human-identity", "attack-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "networkx>=3.2",
    "pyvis>=0.3",
    "click>=8.1",
    "rich>=13.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dateutil>=2.9",
]

[project.urls]
Homepage       = "https://agentsentry.tool"
Repository     = "https://github.com/Abhiram-ops/agent-sentry"
"Bug Tracker"  = "https://github.com/Abhiram-ops/agent-sentry/issues"
Documentation  = "https://agentsentry.tool/docs"

[project.optional-dependencies]
aws    = ["boto3>=1.34"]
azure  = ["azure-identity>=1.16", "azure-mgmt-authorization>=4.0", "azure-mgmt-resource>=23.0"]
gcp    = ["google-auth>=2.28", "google-api-python-client>=2.120"]
github = ["requests>=2.31"]
k8s    = ["kubernetes>=29.0"]
dashboard = ["streamlit>=1.32"]
all-clouds = ["nhi-audit[aws]", "nhi-audit[azure]", "nhi-audit[gcp]", "nhi-audit[github]", "nhi-audit[k8s]"]
dev    = ["pytest>=8.0", "pytest-cov", "black", "ruff", "mypy"]

[project.scripts]
agentsentry = "agentsentry.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentsentry*"]

[tool.setuptools.package-data]
"agentsentry" = ["reporting/templates/*"]
